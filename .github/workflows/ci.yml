name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # All tests, also the ones that compare the SQL normalizer with real MySQL and PostgreSQL servers.
  # Service containers need a Linux runner.
  linux:
    name: Test on Linux, with real databases
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: guard
        ports:
          - 33306:3306
        # The server answers on TCP only when its setup has finished.
        options: >-
          --health-cmd "mysqladmin ping --protocol=tcp -h 127.0.0.1 -uroot -ptest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: guard
        ports:
          - 35432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      BEHAVIORLOCK_TEST_MYSQL: Server=127.0.0.1;Port=33306;User ID=root;Password=test;Database=guard;AllowUserVariables=true
      BEHAVIORLOCK_TEST_POSTGRES: Host=127.0.0.1;Port=35432;Username=postgres;Password=test;Database=guard

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFilePrefix=tests" --results-directory TestResults

      # A test without its connection string is skipped, and a skipped test does not fail the run.
      # So a wrong variable name would turn the real database tests off without a sign.
      # There is one result file per target framework.
      - name: No test was skipped
        run: |
          ls TestResults/*.trx
          if grep -q 'outcome="NotExecuted"' TestResults/*.trx; then
            echo "::error::A test was skipped. Every test must run in this job."
            grep -o 'testName="[^"]*"[^>]*outcome="NotExecuted"' TestResults/*.trx
            exit 1
          fi

      # The test run for .NET 11 records the profile of the sample API again. A difference means that the
      # behavior of an endpoint changed and the new profile was not committed.
      - name: The recorded profile has no change
        run: git diff --exit-code -- samples/SampleApi/behavior.lock.json

  windows:
    name: Test on Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build

      - name: The recorded profile has no change
        run: git diff --exit-code -- samples/SampleApi/behavior.lock.json
